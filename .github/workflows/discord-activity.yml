name: Discord activity log

# Posts push / pull-request / issue activity cards to Discord.
#
# This is the *development* feed and is deliberately separate from the release
# announcement (`release-discord.yml`), which uses the NEX.dev bot token and
# targets the public announcements channel. This one uses a plain webhook and
# should point at the shared dev channel.
#
# Setup — see .github/README-discord-activity.md. These are *repository*-level,
# not org-level: nex-dev-org is on GitHub Free, where private repos cannot read
# organization secrets or variables at all.
#   secret DISCORD_WEBHOOK_URL  — the raw Discord webhook URL
#   var    DISCORD_THREAD_ID    — optional, forum thread to post into
#   var    EMBED_COLOR          — optional, brand accent (defaults to NEX red)
#
# The job never checks out the repository and holds no GITHUB_TOKEN
# permissions, which is what makes `pull_request_target` safe here: it only
# reads the event payload and never executes contributor code.
#
# Rate limiting: every repo in the org posts to one webhook, so a batch release
# fires many runs at once and Discord answers 429 (5 requests / 2s per
# webhook). Pipeline Pling posts once and does not retry, so a burst silently
# loses cards. The stagger below spreads the burst and the retry catches
# whatever still collides.

on:
  push:
  pull_request_target:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]
  issues:
    types: [opened, reopened, closed]

permissions: {}

concurrency:
  group: discord-activity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Forks do not carry repo secrets, so the step would post nothing and fail
    # noisily. Skip cleanly instead.
    if: github.repository_owner == 'nex-dev-org'
    env:
      # The `secrets` context cannot be read from a step-level `if`, but a
      # job-level `env` can, so hoist it here to gate on. Until the secret
      # exists the run goes green-with-skip rather than red.
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Warn if webhook is unset
        if: env.WEBHOOK_URL == ''
        run: |
          echo "::notice title=Discord activity log inactive::\
          Secret DISCORD_WEBHOOK_URL is not set on this repository, so nothing \
          was posted. See .github/README-discord-activity.md for setup."

      # Derived from repo + run id, so sibling repos pushed together land in
      # different slots while a single push stays near-instant. 40 slots across
      # ~18 repos keeps roughly one post per second, well inside Discord's
      # 5-per-2s webhook allowance, and still leaves the job under the
      # one-minute billing round-up.
      - name: Stagger to avoid a webhook burst
        if: env.WEBHOOK_URL != ''
        run: |
          slot=$(printf '%s%s' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | cksum | cut -d' ' -f1)
          slot=$(( slot % 40 ))
          echo "Waiting ${slot}s before posting."
          sleep "$slot"

      - name: Notify Discord
        id: notify
        if: env.WEBHOOK_URL != ''
        continue-on-error: true
        uses: Qbox-project/pipeline-pling@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ vars.DISCORD_THREAD_ID }}
          accent-color: ${{ vars.EMBED_COLOR || '#FF3B3B' }}
          branch-colors: |
            main=#FF3B3B
            master=#FF3B3B
            dev=#F59E0B
            develop=#F59E0B
            feat/**=#3B82F6
            feature/**=#3B82F6
            fix/**=#F97316
            hotfix/**=#DC2626
            chore/**=#6B7280
            docs/**=#8B5CF6
          event-colors: |
            pull-request.opened=#1F883D
            pull-request.ready=#1F883D
            pull-request.draft=#6B7280
            pull-request.merged=#8250DF
            pull-request.closed=#CF222E
            issue.opened=#1F883D
            issue.reopened=#1F883D
            issue.closed=#8250DF
            issue.not_planned=#6B7280
          silent-keyword: '!silent'
          skip-bots: true
          use-repo-username: true
          use-sender-avatar: true
          highlight-first-time-contributors: true

      # Jittered, not fixed: a flat backoff would just re-collide the same set
      # of repos that collided the first time.
      - name: Back off before retry
        if: env.WEBHOOK_URL != '' && steps.notify.outcome == 'failure'
        run: |
          back=$(printf '%s%s-retry' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | cksum | cut -d' ' -f1)
          back=$(( 12 + back % 18 ))
          echo "::warning title=Discord post failed::First attempt failed \
          (usually a 429). Retrying in ${back}s."
          sleep "$back"

      # Inputs are duplicated verbatim because GitHub Actions supports neither
      # YAML anchors nor step-level retry. Keep the two blocks in sync.
      - name: Notify Discord (retry)
        id: retry
        if: env.WEBHOOK_URL != '' && steps.notify.outcome == 'failure'
        continue-on-error: true
        uses: Qbox-project/pipeline-pling@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ vars.DISCORD_THREAD_ID }}
          accent-color: ${{ vars.EMBED_COLOR || '#FF3B3B' }}
          branch-colors: |
            main=#FF3B3B
            master=#FF3B3B
            dev=#F59E0B
            develop=#F59E0B
            feat/**=#3B82F6
            feature/**=#3B82F6
            fix/**=#F97316
            hotfix/**=#DC2626
            chore/**=#6B7280
            docs/**=#8B5CF6
          event-colors: |
            pull-request.opened=#1F883D
            pull-request.ready=#1F883D
            pull-request.draft=#6B7280
            pull-request.merged=#8250DF
            pull-request.closed=#CF222E
            issue.opened=#1F883D
            issue.reopened=#1F883D
            issue.closed=#8250DF
            issue.not_planned=#6B7280
          silent-keyword: '!silent'
          skip-bots: true
          use-repo-username: true
          use-sender-avatar: true
          highlight-first-time-contributors: true

      # `continue-on-error` above keeps a failed post from masking the outcome,
      # so surface the real result here.
      - name: Report result
        if: env.WEBHOOK_URL != ''
        run: |
          if [ "${{ steps.notify.outcome }}" = "success" ]; then
            echo "Posted on first attempt."
          elif [ "${{ steps.retry.outcome }}" = "success" ]; then
            echo "::notice title=Discord posted on retry::First attempt failed, \
            retry succeeded."
          else
            echo "::error title=Discord post failed::Both attempts failed. \
            Check the webhook URL and Discord rate limits."
            exit 1
          fi
